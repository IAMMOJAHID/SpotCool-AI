# The demo day, matching docs/footage/shot_list.md. `people` is the number of occupants visible
# in the zone's clip (<zone>_<scene>.mp4), the ground truth camera counting is scored against.
# Every time is on the world's 15-minute step grid.
name: hybrid_tuesday
description: Half the staff work from home; the East team is fully remote today.
day: 199                 # BOPTEST's peak_cool_day (2026-07-19 on the simulation calendar)
start: "07:00"
end: "19:00"
zones:
  cor:
    - {at: "07:00", scene: empty, people: 0}
    - {at: "08:30", scene: many, people: 4}
    - {at: "12:30", scene: few, people: 1}       # lunch
    - {at: "13:30", scene: many, people: 4}
    - {at: "17:30", scene: few, people: 1}
    - {at: "18:00", scene: empty, people: 0}
  nor:
    - {at: "07:00", scene: empty, people: 0}
    - {at: "08:30", scene: few, people: 2}
    - {at: "12:30", scene: empty, people: 0}
    - {at: "13:30", scene: few, people: 2}
    - {at: "18:00", scene: empty, people: 0}
  sou:
    - {at: "07:00", scene: empty, people: 0}
    - {at: "14:00", scene: meeting, people: 5}
    - {at: "14:15", scene: complaint, people: 5}
    - {at: "14:45", scene: meeting, people: 5}
    - {at: "15:00", scene: empty, people: 0}
  eas:
    - {at: "07:00", scene: empty, people: 0}
  wes:
    - {at: "07:00", scene: empty, people: 0}
    - {at: "08:30", scene: few, people: 1}
    - {at: "10:00", scene: door_open, people: 1}  # the receptionist; two carry boxes through
    - {at: "10:45", scene: few, people: 1}
    - {at: "18:00", scene: empty, people: 0}
events:
  - {type: door_open, zone: wes, from: "10:00", to: "10:45"}
  - {type: booking, room: meeting-south, from: "14:00", to: "15:00",
     subject: "Quarterly review", booked_at: "13:45"}
  - {type: complaint, zone: sou, at: "14:15", channel: voice,
     text: "It's freezing in this meeting room.", audio: south_complaint.wav}
  - {type: clothing, zone: sou, at: "14:30", clothing: heavy}  # the jacket goes on in the clip
