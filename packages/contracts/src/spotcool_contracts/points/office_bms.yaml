# BACnet point map: SpotCool-Office-BMS
# Simulated building management system for BOPTEST `multizone_office_simple_air`
# (5-zone VAV office, 1662.66 m2). Contract v0.1, shared by the world (server) and the agent (client).
#
# Units on the wire are BMS units (degrees-celsius, kilowatts, liters-per-second, percent).
# The world converts to and from BOPTEST units (K, W, m3/s, fraction) using `boptest.conversion`.
#
# Writing rules (see spotcool_contracts.priorities):
#   * SpotCool writes commandable points at priority 10 and releases them with NULL.
#   * Operators write at priority 8; the agent never overwrites a value held at 8 or above.
#   * With no active slot, a setpoint falls back to its relinquish default: the value the
#     building's own schedule applies, read live from the baseline run.
#   * If SPOTCOOL-HEARTBEAT stops toggling for 120 s, the BMS releases every priority-10 command.
device_name: SpotCool-Office-BMS
device_instance: 1001
udp_port: 47808
vendor_name: SpotCool World (simulated)
description: Building management system of a 5-zone VAV office (BOPTEST multizone_office_simple_air).
points:
  # ---- Zone Core (cor) ----
  - object_type: analog-input
    instance: 101
    name: ZN-COR-T
    description: Core zone air temperature
    units: degrees-celsius
    zone: cor
    haystack: [point, sensor, zone, air, temp]
    brick: Zone_Air_Temperature_Sensor
    boptest: {read: hvac_reaZonCor_TZon_y, conversion: "K->degC"}
  - object_type: analog-value
    instance: 201
    name: ZN-COR-CLG-SP
    description: Core zone cooling setpoint (commandable; SpotCool writes at priority 10)
    units: degrees-celsius
    zone: cor
    writability: commandable
    min_value: 16.0
    max_value: 30.0
    resolution: 0.5
    haystack: [point, sp, zone, air, temp, cooling, writable]
    brick: Zone_Air_Cooling_Temperature_Setpoint
    boptest:
      write: hvac_oveZonSupCor_TZonCooSet_u
      read: hvac_oveZonSupCor_TZonCooSet_y
      relinquish_from_baseline: hvac_oveZonSupCor_TZonCooSet_y
      conversion: "K->degC"
  - object_type: analog-value
    instance: 251
    name: ZN-COR-HTG-SP
    description: Core zone heating setpoint (read-only)
    units: degrees-celsius
    zone: cor
    haystack: [point, sp, zone, air, temp, heating]
    brick: Zone_Air_Heating_Temperature_Setpoint
    boptest: {read: hvac_oveZonSupCor_TZonHeaSet_y, conversion: "K->degC"}
  - object_type: analog-input
    instance: 301
    name: ZN-COR-CO2
    description: Core zone air CO2 concentration
    units: parts-per-million
    zone: cor
    haystack: [point, sensor, zone, air, co2]
    brick: CO2_Level_Sensor
    boptest: {read: hvac_reaZonCor_CO2Zon_y}
  - object_type: analog-input
    instance: 351
    name: ZN-COR-SA-FLOW
    description: Core zone VAV discharge airflow
    units: liters-per-second
    zone: cor
    haystack: [point, sensor, zone, discharge, air, flow]
    brick: Discharge_Air_Flow_Sensor
    boptest: {read: hvac_reaZonCor_V_flow_y, conversion: "m3/s->L/s"}
  - object_type: multi-state-value
    instance: 401
    name: ZN-COR-OCC-MODE
    description: Core zone occupancy mode decided by the BMS (schedule plus occupancy-sensor input)
    zone: cor
    states: [Occupied, Standby, Unoccupied]
    haystack: [point, zone, occupied, enum]
    brick: Occupancy_Status
    source: bms
  - object_type: binary-value
    instance: 451
    name: ZN-COR-OCC-SENSOR
    description: >-
      Core zone occupancy-sensor input (commandable). SpotCool may act as a virtual occupancy
      sensor; the BMS then applies the ASHRAE G36 occupied-standby offset on its own.
    zone: cor
    writability: commandable
    states: [Unoccupied, Occupied]
    relinquish_default: Occupied
    haystack: [point, zone, occupancy, sensor, writable]
    brick: Occupancy_Sensor
    source: agent
