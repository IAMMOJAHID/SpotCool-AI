[project]
name = "spotcool-contracts"
version = "0.1.0"
description = "Interface contracts between the SpotCool agent (Person A) and the simulated world (Person B)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotcool_contracts"]
