# The demo video, beat by beat: the single source of truth for every script in scripts/video/.
#
# Each beat runs from `start` to `end` (seconds, on the 30 fps frame grid); the beats tile the
# video with no gap or overlap. `type` is title, motion, screen or phone. `source` is one of:
#   composition: <id>    a HyperFrames composition, video/motion/<id>/index.html, rendered by
#                        scripts/video/render_motion.py with on_screen_text as its variables
#   take: <id>           an OBS take, video/takes/<id>.mkv (or .mp4/.mov), recorded by
#                        scripts/video/take.py; the beat starts `in_s` seconds into it, the
#                        scenes switch at `at` seconds into the beat, and `cues` tell the person
#                        at the keyboard what to do and when
#   clip: <path>         any other video file, relative to the repo root, from `in_s`
# A missing take, clip or render becomes a labelled slate in the cut.
#
# `narration_id` names a section of video/narration.md. `on_screen_text` is the beat's text: a
# composition's variables, or a take's `label` (drawn top left). `sources` are ids in
# video/sources.yaml; every number on screen or in the narration must be among their figures.
# Check it all with: uv run python scripts/video/storyboard_check.py

video:
  title: SpotCool
  fps: 30
  width: 1920
  height: 1080
  max_s: 178

beats:
  - id: title
    start: 0
    end: 4
    type: title
    source: {composition: title}
    narration_id: null
    on_screen_text:
      title: SpotCool
      tagline: Cooling that follows people
    sources: []

  - id: hook
    start: 4
    end: 26
    type: motion
    source: {composition: hook_stats}
    narration_id: hook
    on_screen_text:
      headline: Fewer people come in. The cooling keeps its schedule.
      attendance_value: 56.1 %
      attendance_label: US office attendance, against February 2020
      peak_value: 66.1 %
      peak_label: on the peak day
      attendance_source: "Source: Kastle Systems, badge swipes"
      hvac_value: About 55 %
      hvac_label: of a typical commercial building's energy in India goes to HVAC
      hvac_source: "Source: Bureau of Energy Efficiency, Building Code and Rating in India"
    sources: [kastle, bee-hvac-share]

  - id: plugs_in
    start: 26
    end: 40
    type: motion
    source: {composition: three_connections}
    narration_id: plugs_in
    on_screen_text:
      headline: Three connections the building already has
      hub: SpotCool
      cctv_title: CCTV cameras
      cctv_body: see who is in each zone
      bms_title: Building management system
      bms_body: eases the cooling where nobody is
      complaints_title: Complaints
      complaints_body: so a cold meeting room is heard
      footer: No new sensors
    sources: []

  - id: world
    start: 40
    end: 52
    type: motion
    source: {composition: architecture}
    narration_id: world
    on_screen_text:
      headline: A building to test it on
      agent: SpotCool agent
      world: The world
      bms: BACnet BMS
      vrf: VRF unit
      cameras: CCTV cameras
      complaints: Complaints
      plant_spotcool: BOPTEST office, SpotCool run
      plant_baseline: BOPTEST office, baseline run
      footer: Same weather, same building, same BMS. Only one run gets SpotCool's writes.
    sources: [boptest]

  # The live take, recorded by hand in OBS (docs/runbooks/video-takes.md, The live quad take):
  # one file feeds two beats, each from its own in_s. The lead sets both in_s after recording.
  - id: live
    start: 52
    end: 112
    type: screen
    source:
      take: live_quad
      in_s: 0  # placeholder: the lead sets it, the second the Quad segment starts
      scenes:
        - {at: 0, scene: Quad}
      before:
        - "Follow docs/runbooks/video-takes.md, The live quad take: SpotCool's agent with the Meta models and --vrf, then the world on BOPTEST at speed 60. Recorded by hand in OBS; save it as video/takes/live_quad.mkv."
    narration_id: live
    on_screen_text:
      label: "Live: SpotCool's agent on BOPTEST. Meta's calls are logged in the terminal. The cameras play MEVA dataset clips"
    sources: [meta-models, meva]

  - id: louvers
    start: 112
    end: 124
    type: screen
    source:
      take: live_quad
      in_s: 0  # placeholder: the lead sets it, the second the Dashboard segment (about 14:00) starts
      scenes:
        - {at: 0, scene: Dashboard}
    narration_id: louvers
    on_screen_text:
      label: "The meeting room's louvers follow a person (the camera plays a recorded clip)"
    sources: []

  - id: meta_models
    start: 124
    end: 144
    type: motion
    source: {composition: meta_models}
    narration_id: meta_models
    on_screen_text:
      headline: Four Meta models, one job each
      sam_title: SAM 3.1
      sam_id: sam-3.1
      sam_body: Sees the people in every camera, from a one-word prompt. The building's occupied or empty, and the person the meeting room's louvers follow
      spark_title: Muse Spark
      spark_id: muse-spark-1.3
      spark_body: "Reads the scene: clothing, activity, open doors. The meeting room's comfort setpoint (PMV), and notes on occupied zones"
      voice_title: Muse Voice
      voice_id: muse-voice-transcribe-1.0
      voice_body: Turns a spoken complaint into text
      wonder_title: Muse Wonder
      wonder_id: muse-wonder-1.0
      wonder_body: Works out what a complaint means when keywords can't, and answers it. One plain sentence for each step's decisions
      footer: Models perceive. Code decides. No language model writes to the BMS.
    sources: [meta-models]

  - id: results
    start: 144
    end: 164
    type: motion
    source: {composition: results_card, run_id: live-quad-boptest-s60}
    narration_id: results
    on_screen_text:
      title: "BOPTEST: SpotCool's policy against the baseline"
    sources: [run-live-quad, boptest]

  - id: rollout
    start: 164
    end: 172
    type: motion
    source: {composition: rollout_privacy}
    narration_id: rollout
    on_screen_text:
      rollout_title: Rollout
      rollout_1: No new hardware. It runs on the cameras and the BMS already there.
      rollout_2: A real BMS needs the same BACnet points and occupied-standby.
      privacy_title: Privacy
      privacy_1: SpotCool never stores a frame.
      privacy_2: The record keeps counts and decisions, never images.
    sources: []

  - id: close
    start: 172
    end: 176
    type: title
    source: {composition: close}
    narration_id: close
    on_screen_text:
      title: SpotCool
      tagline: Cooling that follows people
      repo: github.com/IAMMOJAHID/SpotCool-AI
    sources: []
