# The demo video, beat by beat: the single source of truth for every script in scripts/video/.
#
# Each beat runs from `start` to `end` (seconds, on the 30 fps frame grid); the beats tile the
# video with no gap or overlap. `type` is title, motion, screen or phone. `source` is one of:
#   composition: <id>    a HyperFrames composition, video/motion/<id>/index.html, rendered by
#                        scripts/video/render_motion.py with on_screen_text as its variables
#   take: <id>           an OBS take, video/takes/<id>.mkv (or .mp4/.mov), recorded by
#                        scripts/video/take.py; the beat starts `in_s` seconds into it, the
#                        scenes switch at `at` seconds into the beat, and `cues` tell the person
#                        at the keyboard what to do and when
#   clip: <path>         any other video file, relative to the repo root, from `in_s`
# A missing take, clip or render becomes a labelled slate in the cut.
#
# `narration_id` names a section of video/narration.md. `on_screen_text` is the beat's text: a
# composition's variables, or a take's `label` (drawn top left). `sources` are ids in
# video/sources.yaml; every number on screen or in the narration must be among their figures.
# Check it all with: uv run python scripts/video/storyboard_check.py

video:
  title: SpotCool
  fps: 30
  width: 1920
  height: 1080
  max_s: 178

beats:
  # The person's own voice carries the video: each beat's `talk` is its audio and, with `crop`, the
  # round video at bottom right. talk.mp4's in_s are set once it is recorded (prep_clips.py).
  - id: intro
    start: 0
    end: 6
    type: screen
    source: {clip: video/takes/intro.mp4}
    narration_id: intro
    talk: {clip: video/takes/intro.mp4, in_s: 0}
    on_screen_text: {}
    sources: []

  - id: story
    start: 6
    end: 40
    type: motion
    source: {composition: story}
    narration_id: story
    talk: {clip: video/takes/body_round.mp4, in_s: 0, crop: [910, 20, 560]}
    on_screen_text:
      stat_value: Up to 70 %
      stat_label: of the UAE's electricity goes to air conditioning
      stat_source: "Source: Emirates Authority for Standardisation and Metrology, via The National, 2012"
      sam_name: SAM 3.1
      spot_3d: 3D spot cooling
    sources: [uae-cooling, meta-models]

  - id: whiteboard
    start: 40
    end: 55.5
    type: screen
    source: {clip: video/takes/whiteboard.mp4}
    narration_id: whiteboard
    talk: {clip: video/takes/whiteboard.mp4, in_s: 0}
    on_screen_text: {}
    sources: [boptest]

  - id: code
    start: 55.5
    end: 75.5
    type: screen
    source: {clip: video/takes/code.mp4}
    narration_id: code
    talk: {clip: video/takes/code.mp4, in_s: 0}
    on_screen_text: {}
    sources: []

  # The live take, recorded by hand in OBS (docs/runbooks/video-takes.md, The live quad take):
  # one file feeds two beats, each from its own in_s.
  - id: live
    start: 75.5
    end: 127.5
    type: screen
    source:
      take: live_quad
      in_s: 44  # sim 08:13: every zone empty at 28 degC; the 08:30 arrivals land 17 s in
      scenes:
        - {at: 0, scene: Quad}
    narration_id: live
    talk: {clip: video/takes/talk.mp4, in_s: 0, crop: [910, 20, 560], size: 240}
    on_screen_text:
      label: "Live: SpotCool's agent on BOPTEST. Meta's calls are logged in the terminal. The zone cameras play MEVA dataset clips"
    sources: [meta-models, meva]

  - id: louvers
    start: 127.5
    end: 139.5
    type: screen
    source:
      take: live_quad
      in_s: 405  # the Dashboard segment runs 390.5-427: the complaint's writes, then the louvers
      # The Results panel's mid-day figures aren't quotable, and the chat box has no agent URL here.
      cover:
        - {x: 1268, y: 98, w: 646, h: 394, color: '0x040809'}
        - {x: 1278, y: 908, w: 300, h: 36, color: '0x0a1117'}
      scenes:
        - {at: 0, scene: Dashboard}
    narration_id: louvers
    talk: {clip: video/takes/talk.mp4, in_s: 0, crop: [910, 20, 560]}
    on_screen_text:
      label: "The meeting room's louvers follow a person (the camera plays a recorded clip)"
    sources: []

  - id: meta_models
    start: 139.5
    end: 154.5
    type: motion
    source: {composition: meta_models}
    narration_id: meta_models
    talk: {clip: video/takes/talk.mp4, in_s: 0, crop: [910, 20, 560]}
    on_screen_text:
      headline: Five Meta models, one job each
      sam_title: SAM 3.1
      sam_id: sam-3.1
      sam_body: Sees the people in every camera, from a one-word prompt. The building's occupied or empty, and the person the meeting room's louvers follow
      spark_title: Muse Spark
      spark_id: muse-spark-1.3
      spark_body: "Reads the scene: clothing, activity, open doors. The meeting room's comfort setpoint (PMV), and notes on occupied zones"
      voice_title: Muse Voice
      voice_id: muse-voice-transcribe-1.0
      voice_body: Turns a spoken complaint into text
      wonder_title: Muse Wonder
      wonder_id: muse-wonder-1.0
      wonder_body: Works out what a complaint means when keywords can't, and answers it. One plain sentence for each step's decisions
      image_title: Muse Image
      image_id: muse-image-1.0
      image_body: Redraws a camera as a faceless illustration, for an optional privacy view. Off in this run
      footer: Models perceive. Code decides. No language model writes to the BMS.
    sources: [meta-models]


  - id: results
    start: 154.5
    end: 168.5
    type: motion
    source: {composition: results_card, run_id: live-quad-boptest-s60-c}
    narration_id: results
    talk: {clip: video/takes/talk.mp4, in_s: 0, crop: [910, 20, 560], size: 260}
    on_screen_text:
      title: "BOPTEST: SpotCool's policy against the baseline"
    sources: [run-live-quad, boptest]

  - id: close
    start: 168.5
    end: 172.5
    type: title
    source: {composition: close}
    narration_id: close
    talk: {clip: video/takes/talk.mp4, in_s: 0, crop: [910, 20, 560]}
    on_screen_text:
      title: SpotCool
      tagline: Cooling that follows people
      repo: github.com/IAMMOJAHID/SpotCool-AI
    sources: []

  - id: goodbye
    start: 172.5
    end: 175.5
    type: screen
    source: {clip: video/takes/thanks.mp4}
    narration_id: goodbye
    talk: {clip: video/takes/thanks.mp4, in_s: 0}
    on_screen_text: {}
    sources: []
