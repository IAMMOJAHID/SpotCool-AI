# Every source a beat of video/storyboard.yaml cites, by id.
#
# figures: the numbers the source backs. A number on screen or in the narration must be among the
#   figures of a source its beat cites (scripts/video/storyboard_check.py).
# doc: the file in this repo that records the figures; the check finds each figure's numbers in
#   it. Published figures and our runs' figures live in docs/release/numbers.md, and nowhere
#   else: a number not on that page is not shown.
# cite: the line on the closing sources slide.

kastle:
  name: Kastle Systems, Back to Work Barometer (US badge swipes against February 2020)
  url: https://www.kastle.com/safety-wellness/getting-america-back-to-work/
  doc: docs/release/numbers.md
  figures: ["56.1 %", "66.1 % on the peak day", "February 2020"]
  cite: "US office attendance, badge swipes against February 2020 (10-city weekly average; peak day): Kastle Systems, Back to Work Barometer (kastle.com)"

