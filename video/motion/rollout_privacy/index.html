<!doctype html>
<!-- Rollout and privacy: two panels, each line as the narration says it. -->
<html
  lang="en"
  data-composition-variables='[
    {"id": "rollout_title", "type": "string", "label": "Rollout title", "default": "Rollout"},
    {"id": "rollout_1", "type": "string", "label": "Rollout, first line", "default": "No new hardware."},
    {"id": "rollout_2", "type": "string", "label": "Rollout, second line", "default": "The agent’s code does not change."},
    {"id": "privacy_title", "type": "string", "label": "Privacy title", "default": "Privacy"},
    {"id": "privacy_1", "type": "string", "label": "Privacy, first line", "default": "Frames stay in memory."},
    {"id": "privacy_2", "type": "string", "label": "Privacy, second line", "default": "The record keeps counts and decisions, never images."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SpotCool: rollout and privacy</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #111821;
        --line: #2a3542;
        --ink: #f2f1ec;
        --muted: #a3acb6;
        --cool: #63d3e8;
        --spot: #3d8bf0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #roll-scene {
        position: absolute;
        inset: 0;
      }
      #roll-bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      .roll-panel {
        position: absolute;
        top: 180px;
        width: 760px;
        height: 640px;
        padding: 56px 56px;
        border: 2px solid var(--line);
        border-radius: 26px;
        background: var(--panel);
      }
      #roll-rollout { left: 140px; }
      #roll-privacy { left: 1020px; }
      .roll-icon {
        position: relative;
        width: 92px;
        height: 92px;
        border-radius: 22px;
        background: rgba(99, 211, 232, 0.12);
      }
      /* A plug: two prongs and a body. */
      #roll-rollout .roll-icon i {
        position: absolute;
        top: 18px;
        width: 8px;
        height: 22px;
        border-radius: 3px;
        background: var(--cool);
      }
      #roll-rollout .roll-icon i:nth-child(1) { left: 32px; }
      #roll-rollout .roll-icon i:nth-child(2) { left: 52px; }
      #roll-rollout .roll-icon b {
        position: absolute;
        left: 24px;
        top: 40px;
        width: 44px;
        height: 30px;
        border-radius: 6px 6px 14px 14px;
        background: var(--cool);
      }
      /* A padlock: a shackle and a body. */
      #roll-privacy .roll-icon i {
        position: absolute;
        left: 28px;
        top: 14px;
        width: 36px;
        height: 36px;
        border: 6px solid var(--cool);
        border-bottom: none;
        border-radius: 18px 18px 0 0;
      }
      #roll-privacy .roll-icon b {
        position: absolute;
        left: 20px;
        top: 42px;
        width: 52px;
        height: 36px;
        border-radius: 8px;
        background: var(--cool);
      }
      .roll-title {
        margin-top: 34px;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .roll-line {
        margin-top: 30px;
        padding-left: 30px;
        border-left: 4px solid var(--cool);
        font-size: 34px;
        line-height: 1.3;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="rollout_privacy" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <div id="roll-scene" class="clip" data-start="0" data-duration="13" data-track-index="1">
        <div id="roll-bg"></div>
        <div class="roll-panel" id="roll-rollout">
          <div class="roll-icon"><i></i><i></i><b></b></div>
          <div class="roll-title" id="roll-rollout-title" data-var-text="rollout_title">Rollout</div>
          <div class="roll-line" id="roll-rollout-1" data-var-text="rollout_1">No new hardware.</div>
          <div class="roll-line" id="roll-rollout-2" data-var-text="rollout_2">The agent's code does not change.</div>
        </div>
        <div class="roll-panel" id="roll-privacy">
          <div class="roll-icon"><i></i><b></b></div>
          <div class="roll-title" id="roll-privacy-title" data-var-text="privacy_title">Privacy</div>
          <div class="roll-line" id="roll-privacy-1" data-var-text="privacy_1">Frames stay in memory.</div>
          <div class="roll-line" id="roll-privacy-2" data-var-text="privacy_2">The record keeps counts and decisions, never images.</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.5, ease: "power4.out" };
      const enter = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)", x: -20 }, IN, at);
      tl.fromTo("#roll-rollout", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.2);
      enter("#roll-rollout-1", 0.8);
      enter("#roll-rollout-2", 3.0);
      // "Frames stay in memory. The record keeps counts and decisions, never images."
      tl.fromTo("#roll-privacy", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 5.6);
      enter("#roll-privacy-1", 6.0);
      enter("#roll-privacy-2", 7.9);
      window.__timelines["rollout_privacy"] = tl;
    </script>
  </body>
</html>
