<!doctype html>
<!--
  How we test it: the agent talks to a stand-in building (the world), whose BMS drives one
  BOPTEST office model twice, once with SpotCool and once as the baseline. One part appears
  as the narration names it.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id": "headline", "type": "string", "label": "Headline", "default": "A building to test it on"},
    {"id": "agent", "type": "string", "label": "Agent", "default": "SpotCool agent"},
    {"id": "world", "type": "string", "label": "World", "default": "The world"},
    {"id": "bms", "type": "string", "label": "BMS", "default": "BACnet BMS"},
    {"id": "vrf", "type": "string", "label": "VRF", "default": "VRF unit"},
    {"id": "cameras", "type": "string", "label": "Cameras", "default": "CCTV cameras"},
    {"id": "complaints", "type": "string", "label": "Complaints", "default": "Complaints"},
    {"id": "plant_spotcool", "type": "string", "label": "SpotCool plant", "default": "BOPTEST office, SpotCool run"},
    {"id": "plant_baseline", "type": "string", "label": "Baseline plant", "default": "BOPTEST office, baseline run"},
    {"id": "footer", "type": "string", "label": "Footer", "default": "Only one run gets SpotCool’s writes."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SpotCool: architecture</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #111821;
        --panel-2: #16202b;
        --line: #2a3542;
        --ink: #f2f1ec;
        --muted: #a3acb6;
        --cool: #63d3e8;
        --spot: #3d8bf0;
        --base: #eb6834;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #arch-scene {
        position: absolute;
        inset: 0;
      }
      #arch-bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #arch-headline {
        position: absolute;
        left: 140px;
        top: 100px;
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      #arch-agent {
        position: absolute;
        left: 140px;
        top: 430px;
        width: 340px;
        height: 170px;
        border-radius: 22px;
        border: 3px solid var(--cool);
        background: linear-gradient(135deg, rgba(61, 139, 240, 0.26), rgba(99, 211, 232, 0.1));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 24px;
        font-size: 42px;
        font-weight: 800;
        line-height: 1.1;
      }
      /* The link between agent and world: a static arm, a line that draws. */
      #arch-link {
        position: absolute;
        left: 480px;
        top: 513px;
        width: 140px;
        height: 4px;
      }
      #arch-link-line {
        display: block;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: var(--cool);
      }
      #arch-world {
        position: absolute;
        left: 620px;
        top: 220px;
        width: 1160px;
        height: 640px;
        border-radius: 26px;
        border: 2px dashed #3a4756;
        background: rgba(17, 24, 33, 0.6);
      }
      #arch-world-name {
        position: absolute;
        left: 34px;
        top: 24px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .arch-chip {
        position: absolute;
        top: 300px;
        width: 250px;
        height: 96px;
        border-radius: 16px;
        border: 2px solid var(--line);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
      }
      #arch-bms { left: 660px; border-color: var(--cool); }
      #arch-vrf { left: 940px; }
      #arch-cameras { left: 1220px; }
      #arch-complaints { left: 1500px; }
      /* The BMS feeds both plants: a stem down, then a bar across. */
      #arch-stem {
        position: absolute;
        left: 783px;
        top: 396px;
        width: 4px;
        height: 104px;
      }
      #arch-stem-line {
        display: block;
        width: 4px;
        height: 100%;
        background: var(--cool);
      }
      #arch-bar {
        position: absolute;
        left: 783px;
        top: 456px;
        width: 701px;
        height: 4px;
      }
      #arch-drop {
        position: absolute;
        left: 1480px;
        top: 456px;
        width: 4px;
        height: 44px;
      }
      #arch-drop-line {
        display: block;
        width: 4px;
        height: 100%;
        background: var(--cool);
      }
      #arch-bar-line {
        display: block;
        width: 100%;
        height: 4px;
        background: var(--cool);
      }
      .arch-plant {
        position: absolute;
        top: 500px;
        width: 520px;
        height: 230px;
        border-radius: 20px;
        border: 3px solid var(--spot);
        background: rgba(61, 139, 240, 0.12);
        padding: 30px 34px;
      }
      #arch-plant-spotcool { left: 660px; }
      #arch-plant-baseline { left: 1220px; border-color: var(--base); background: rgba(235, 104, 52, 0.1); }
      .arch-plant-name {
        font-size: 36px;
        font-weight: 700;
        line-height: 1.2;
      }
      .arch-plant-floor {
        position: absolute;
        left: 34px;
        bottom: 30px;
        display: flex;
        gap: 10px;
      }
      .arch-plant-floor i {
        display: block;
        width: 72px;
        height: 44px;
        border-radius: 8px;
        background: rgba(242, 241, 236, 0.1);
        border: 2px solid rgba(242, 241, 236, 0.22);
      }
      #arch-footer {
        position: absolute;
        left: 660px;
        top: 770px;
        width: 1080px;
        font-size: 30px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="architecture" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="arch-scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="arch-bg"></div>
        <div id="arch-headline" data-var-text="headline">A building to test it on</div>
        <div id="arch-agent" data-var-text="agent">SpotCool agent</div>
        <div id="arch-link" data-layout-ignore><span id="arch-link-line"></span></div>
        <div id="arch-world" data-layout-allow-overlap>
          <div id="arch-world-name" data-var-text="world">The world</div>
        </div>
        <div class="arch-chip" id="arch-bms" data-var-text="bms">BACnet BMS</div>
        <div class="arch-chip" id="arch-vrf" data-var-text="vrf">VRF unit</div>
        <div class="arch-chip" id="arch-cameras" data-var-text="cameras">CCTV cameras</div>
        <div class="arch-chip" id="arch-complaints" data-var-text="complaints">Complaints</div>
        <div id="arch-stem" data-layout-ignore><span id="arch-stem-line"></span></div>
        <div id="arch-bar" data-layout-ignore><span id="arch-bar-line"></span></div>
        <div id="arch-drop" data-layout-ignore><span id="arch-drop-line"></span></div>
        <div class="arch-plant" id="arch-plant-spotcool">
          <div class="arch-plant-name" data-var-text="plant_spotcool">BOPTEST office, SpotCool run</div>
          <div class="arch-plant-floor"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="arch-plant" id="arch-plant-baseline">
          <div class="arch-plant-name" data-var-text="plant_baseline">BOPTEST office, baseline run</div>
          <div class="arch-plant-floor"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div id="arch-footer" data-var-text="footer">Only one run gets SpotCool's writes.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // Lines draw with clip-path, a mask reveal.
      // A reveal ends at 0.01 %, not 0: the browser shortens "inset(0% 0% 0% 0%)" to "inset(0%)",
      // and GSAP cannot tween between the two forms, so it would jump at the end.
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power4.out" };
      const enter = (sel, at, extra = {}) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)", y: 16, ...extra }, IN, at);

      // "To test it, we built a building":
      enter("#arch-headline", 0.3);
      enter("#arch-agent", 0.7);
      tl.fromTo("#arch-world", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 1.2);
      tl.fromTo("#arch-link-line", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0.01% 0% 0%)", duration: 0.5, ease: "power3.inOut" }, 1.7);
      // "a BACnet BMS, cameras and occupants":
      enter("#arch-bms", 2.2);
      enter("#arch-vrf", 2.7);
      enter("#arch-cameras", 3.2);
      enter("#arch-complaints", 3.7);
      // "Behind it, BOPTEST runs one office twice":
      tl.fromTo("#arch-stem-line", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0.01% 0%)", duration: 0.4, ease: "power2.inOut" }, 5.2);
      tl.fromTo("#arch-bar-line", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0.01% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#arch-drop-line", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0.01% 0%)", duration: 0.25, ease: "power2.out" }, 6.0);
      enter("#arch-plant-spotcool", 5.9);
      enter("#arch-plant-baseline", 7.2);
      enter("#arch-footer", 9.0);
      window.__timelines["architecture"] = tl;
    </script>
  </body>
</html>
