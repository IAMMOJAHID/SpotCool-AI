<!doctype html>
<!-- How SpotCool uses Meta's models: five cards, one model each, shown as the narration names them, then the rule that code decides. -->
<html
  lang="en"
  data-composition-variables='[
    {"id": "headline", "type": "string", "label": "Headline", "default": "Five models, one job each"},
    {"id": "sam_title", "type": "string", "label": "SAM title", "default": "Model"},
    {"id": "sam_id", "type": "string", "label": "SAM model id", "default": "model-id"},
    {"id": "sam_body", "type": "string", "label": "SAM body", "default": "What it does"},
    {"id": "spark_title", "type": "string", "label": "Spark title", "default": "Model"},
    {"id": "spark_id", "type": "string", "label": "Spark model id", "default": "model-id"},
    {"id": "spark_body", "type": "string", "label": "Spark body", "default": "What it does"},
    {"id": "voice_title", "type": "string", "label": "Voice title", "default": "Model"},
    {"id": "voice_id", "type": "string", "label": "Voice model id", "default": "model-id"},
    {"id": "voice_body", "type": "string", "label": "Voice body", "default": "What it does"},
    {"id": "wonder_title", "type": "string", "label": "Wonder title", "default": "Model"},
    {"id": "wonder_id", "type": "string", "label": "Wonder model id", "default": "model-id"},
    {"id": "wonder_body", "type": "string", "label": "Wonder body", "default": "What it does"},
    {"id": "image_title", "type": "string", "label": "Image title", "default": "Model"},
    {"id": "image_id", "type": "string", "label": "Image model id", "default": "model-id"},
    {"id": "image_body", "type": "string", "label": "Image body", "default": "What it does"},
    {"id": "footer", "type": "string", "label": "Footer", "default": "Models perceive. Code decides."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SpotCool: Meta's models</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #111821;
        --line: #2a3542;
        --ink: #f2f1ec;
        --muted: #a3acb6;
        --cool: #63d3e8;
        --spot: #3d8bf0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #models-scene {
        position: absolute;
        inset: 0;
      }
      #models-bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #models-headline {
        position: absolute;
        left: 70px;
        top: 62px;
        width: 1600px;
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .models-card {
        position: absolute;
        width: 570px;
        height: 346px;
        padding: 26px 32px 0 32px;
        border: 2px solid var(--line);
        border-top: 4px solid var(--cool);
        border-radius: 18px;
        background: var(--panel);
      }
      /* Three over two, so the bottom right stays clear for the round video of the speaker. */
      #models-sam { left: 70px; top: 158px; }
      #models-spark { left: 675px; top: 158px; }
      #models-voice { left: 1280px; top: 158px; }
      #models-wonder { left: 70px; top: 526px; width: 705px; height: 280px; }
      #models-image { left: 805px; top: 526px; width: 705px; height: 280px; }
      .models-title {
        font-size: 40px;
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
      }
      .models-id {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        margin-top: 6px;
        color: var(--cool);
        white-space: nowrap;
      }
      .models-body {
        margin-top: 12px;
        font-size: 29px;
        line-height: 1.32;
        color: var(--muted);
      }
      #models-footer {
        position: absolute;
        left: 70px;
        top: 838px;
        width: 1440px;
        text-align: center;
        font-size: 38px;
        font-weight: 700;
        color: var(--cool);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="meta_models" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="models-scene" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <div id="models-bg"></div>
        <div id="models-headline" data-var-text="headline">Five models, one job each</div>

        <div class="models-card" id="models-sam">
          <div class="models-head">
            <div class="models-title" data-var-text="sam_title">Model</div>
            <div class="models-id" data-var-text="sam_id">model-id</div>
          </div>
          <div class="models-body" data-var-text="sam_body">What it does</div>
        </div>
        <div class="models-card" id="models-spark">
          <div class="models-head">
            <div class="models-title" data-var-text="spark_title">Model</div>
            <div class="models-id" data-var-text="spark_id">model-id</div>
          </div>
          <div class="models-body" data-var-text="spark_body">What it does</div>
        </div>
        <div class="models-card" id="models-voice">
          <div class="models-head">
            <div class="models-title" data-var-text="voice_title">Model</div>
            <div class="models-id" data-var-text="voice_id">model-id</div>
          </div>
          <div class="models-body" data-var-text="voice_body">What it does</div>
        </div>
        <div class="models-card" id="models-wonder">
          <div class="models-head">
            <div class="models-title" data-var-text="wonder_title">Model</div>
            <div class="models-id" data-var-text="wonder_id">model-id</div>
          </div>
          <div class="models-body" data-var-text="wonder_body">What it does</div>
        </div>
        <div class="models-card" id="models-image">
          <div class="models-head">
            <div class="models-title" data-var-text="image_title">Model</div>
            <div class="models-id" data-var-text="image_id">model-id</div>
          </div>
          <div class="models-body" data-var-text="image_body">What it does</div>
        </div>

        <div id="models-footer" data-var-text="footer">Models perceive. Code decides.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const card = (name, at) =>
        tl.fromTo(`#models-${name}`, { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, at);
      // The headline, then each card as the narration names its model.
      tl.fromTo("#models-headline", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.0);
      card("sam", 1.5);
      card("spark", 3.0);
      card("voice", 6.0);
      card("wonder", 7.8);
      card("image", 9.6);
      // "No language model writes to the building":
      tl.fromTo("#models-footer", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 11.8);
      window.__timelines["meta_models"] = tl;
    </script>
  </body>
</html>
