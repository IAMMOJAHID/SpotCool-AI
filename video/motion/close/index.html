<!doctype html>
<!-- The close and the sources slide: the sources are generated from video/sources.yaml. -->
<html
  lang="en"
  data-composition-variables='[
    {"id": "title", "type": "string", "label": "Title", "default": "SpotCool"},
    {"id": "tagline", "type": "string", "label": "Tagline", "default": "Cooling that follows people"},
    {"id": "repo", "type": "string", "label": "Repository", "default": "github.com"},
    {"id": "sources_text", "type": "string", "label": "Sources (one per line)", "default": "Sources"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SpotCool: close</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0b0f14;
        --line: #2a3542;
        --ink: #f2f1ec;
        --muted: #a3acb6;
        --dim: #8a939e;
        --cool: #63d3e8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #close-scene {
        position: absolute;
        inset: 0;
      }
      #close-bg {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      #close-title {
        position: absolute;
        left: 140px;
        top: 150px;
        font-size: 140px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      #close-tagline {
        position: absolute;
        left: 146px;
        top: 316px;
        font-size: 46px;
        color: var(--muted);
      }
      #close-repo {
        position: absolute;
        left: 146px;
        top: 400px;
        font-family: "JetBrains Mono", monospace;
        font-size: 32px;
        color: var(--cool);
      }
      #close-rule {
        position: absolute;
        left: 140px;
        top: 500px;
        width: 1640px;
        height: 2px;
        background: var(--line);
      }
      #close-sources-head {
        position: absolute;
        left: 140px;
        top: 530px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #close-sources {
        position: absolute;
        left: 140px;
        top: 580px;
        width: 1640px;
        font-size: 25px;
        line-height: 1.55;
        color: var(--dim);
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="close" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="close-scene" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="close-bg"></div>
        <div id="close-title" data-var-text="title">SpotCool</div>
        <div id="close-tagline" data-var-text="tagline">Cooling that follows people</div>
        <div id="close-repo" data-var-text="repo">github.com</div>
        <div id="close-rule"></div>
        <div id="close-sources-head">Sources</div>
        <div id="close-sources" data-var-text="sources_text">Sources</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // A reveal ends at 0.01 %, not 0: the browser shortens "inset(0% 0% 0% 0%)" to "inset(0%)",
      // and GSAP cannot tween between the two forms, so it would jump at the end.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#close-title", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.2);
      tl.fromTo("#close-tagline", { opacity: 0, color: "#4d5662" }, { opacity: 1, color: "#a3acb6", duration: 0.6, ease: "power2.out" }, 0.7);
      tl.fromTo("#close-repo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.1);
      tl.fromTo("#close-rule", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0.01% 0% 0%)", duration: 0.8, ease: "expo.out" }, 1.0);
      tl.fromTo(["#close-sources-head", "#close-sources"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 1.4);
      window.__timelines["close"] = tl;
    </script>
  </body>
</html>
